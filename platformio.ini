; T89 main node — STM32H723ZGT6 (WeAct), replacing the ESP32-S3 main node.
;
; Mirrors stm32h723_transmitter_node's proven setup: same board, same framework,
; same FDCAN build flag. Deliberately NO radio anywhere in this node — see
; src/main_node/MAX9926_EMI_notes.md in the T89 repo: RPM dropped to zero in
; step with WiFi TX, and this node sits next to the VR front end.

[platformio]
default_envs = h723_main_node

[env:h723_main_node]
platform = ststm32
board = generic_h723zgt6
board_upload.maximum_ram_size = 327680
framework = arduino
upload_protocol = stlink
monitor_speed = 115200

build_src_filter = -<*> +<*.cpp>

lib_deps =
    moononournation/GFX Library for Arduino

build_flags =
    -I${PROJECT_DIR}/include
    -DUSE_PWR_LDO_SUPPLY
    -Wl,-u,_printf_float
    -DHAL_FDCAN_MODULE_ENABLED   ; not enabled by default on this board; the H723 has
                                 ; FDCAN, and the Arduino STM32_CAN library only does bxCAN

    ; --- Serial console on USB CDC -----------------------------------------
    ; Puts `Serial` (and so serial_cli.cpp) on the USB connector instead of a
    ; UART: with USBD_USE_CDC the core defines Serial as SerialUSB, no code
    ; change. This is not optional cosmetics — the generic H723ZG variant
    ; defaults Serial to UART4 on PA0/PA1, and PA0 is PIN_RPM_IN. Leaving it on
    ; the UART would have the console fighting the RPM counter for the pin.
    ;
    ; H72x/H73x has no OTG_FS: the one USB peripheral is OTG_HS, and PA11/PA12
    ; only appear in its pin map under USE_USB_HS_IN_FS (the internal FS PHY,
    ; i.e. no external ULPI). All four flags are needed.
    ;
    ; The USB 48 MHz clock needs nothing here: the variant's SystemClock_Config
    ; already turns on HSI48, selects it for USB, and trims it with CRS against
    ; USB SOF. VBUS sensing is off unless USBD_VBUS_DETECTION_ENABLE is defined,
    ; which is what allows a data-only cable to a self-powered node.
    ;
    ; SIDE EFFECT: USB MspInit walks the WHOLE pin map and configures PA8, PA9
    ; and PA10 (SOF / VBUS / ID) as well as PA11/PA12. PA8 is PIN_MATRIX_DATA —
    ; the NeoMatrix driver must claim it back AFTER Serial.begin().
    -DUSBCON
    -DUSBD_USE_CDC
    -DUSE_USB_HS
    -DUSE_USB_HS_IN_FS
